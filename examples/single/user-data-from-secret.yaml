# Cloud-init that carries credentials.
#
# `userData` is part of the spec, so anyone with `get` on HetznerServer can read
# it and it ends up in Git if you manage the object with GitOps. That is fine
# for a package list, and wrong for a cluster join token or a registry key.
#
# `userDataSecretRef` reads the document from a Secret in the same namespace
# instead. It is read once, at create time — `userData` cannot be changed on a
# running server either way — and never copied into status. The controller needs
# its optional Secret read permission for this: install the chart with
# `rbac.secretsAccess=true`.
#
# If the Secret or the key is missing, the create fails and is retried rather
# than booting a server whose user data never arrived. A Secret that arrives
# late — synced by External Secrets or the 1Password operator — is therefore
# safe: the server appears once it is there.
apiVersion: v1
kind: Secret
metadata:
  name: k3s-agent-cloud-init
  namespace: default
type: Opaque
stringData:
  # In a real cluster this comes from your secret manager, not from a manifest.
  user-data: |
    #cloud-config
    runcmd:
      # Whatever the node needs to configure itself. This one joins a
      # Kubernetes cluster, which is why the document holds a join token --
      # and why it belongs in a Secret rather than in the spec.
      - /usr/local/bin/join-cluster --server https://10.0.0.2:6443 --token a-join-token
---
apiVersion: hcloud.shebanglabs.io/v1alpha1
kind: HetznerServer
metadata:
  name: agent-01
  namespace: default
spec:
  serverType: cx22
  image: ubuntu-24.04
  location: nbg1
  userDataSecretRef:
    name: k3s-agent-cloud-init
    # Defaults to user-data; name the key if you store several documents in one
    # Secret.
    key: user-data
  networks:
    - networkRef:
        hetznerName: k3s
