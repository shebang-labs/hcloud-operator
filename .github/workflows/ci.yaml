name: CI

# The default token is read-only; jobs opt in to more where they need it.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: shebanglabs/hetzner-server-controller
  CHART: charts/hetzner-server-controller

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dependency-review posts its summary as a pull request comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The chart tests render the chart with the real helm binary.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install dependencies
        # --ignore-scripts: a compromised package's install hook is the usual
        # way a supply-chain attack gets code execution, and it runs before any
        # test could notice. Nothing in this tree needs one.
        run: npm ci --ignore-scripts

      - run: npm run lint
      - run: npm run typecheck
      - name: Test with coverage
        # No Hetzner token and no cluster: every test runs against fakes.
        run: npm run test:coverage
      - run: npm run build

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

      - name: Audit runtime dependencies
        # The runtime tree ships in the image, so it is the gate.
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=moderate

  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Refuses to start without a token, with a clear message
        run: |
          output=$(docker run --rm "$IMAGE:ci" 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q 'HETZNER_TOKEN is not set'

      - name: Runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE:ci" -u)
          echo "uid $uid"
          test "$uid" = "65532"

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Save the image for the chart job
        run: docker save "$IMAGE:ci" -o /tmp/image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  chart:
    name: Lint and install the chart
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Lint the chart
        run: ct lint --config ct.yaml --all

      - name: Validate rendered manifests against the Kubernetes schemas
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          for values in "$CHART"/ci/*-values.yaml; do
            echo "== $values"
            helm template hsc "$CHART" -f "$values" --include-crds \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -kubernetes-version 1.31.0 \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: /tmp

      - name: Start a throwaway cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: chart

      - name: Load the image into the cluster
        run: |
          docker load -i /tmp/image.tar
          kind load docker-image "$IMAGE:ci" --name chart

      - name: Install
        # A placeholder token: the controller starts, syncs its informers and
        # becomes Ready without ever calling Hetzner, because no resource exists.
        run: |
          kubectl create namespace hetzner-server-controller
          helm install hsc "$CHART" -n hetzner-server-controller \
            --set hetzner.token=ci-placeholder \
            --set image.tag=ci --set image.pullPolicy=Never \
            --wait --timeout 3m
          kubectl -n hetzner-server-controller get pods -o wide

      - name: helm test
        run: helm test hsc -n hetzner-server-controller --logs

      - name: Every example passes the API server's own validation
        run: |
          kubectl apply -f examples/stack/00-namespace.yaml
          find examples -name '*.yaml' -print0 | xargs -0 -I{} kubectl apply --dry-run=server -f {}

      - name: Upgrade to a user-managed Secret and a single namespace
        run: |
          kubectl -n hetzner-server-controller create secret generic my-token --from-literal=token=ci-placeholder
          helm upgrade hsc "$CHART" -n hetzner-server-controller \
            --set hetzner.existingSecret=my-token \
            --set controller.watchNamespace=demo \
            --set image.tag=ci --set image.pullPolicy=Never \
            --wait --timeout 3m
          kubectl get clusterrole hsc-hetzner-server-controller 2>/dev/null && exit 1 || echo "ClusterRole gone, Role in place"
          kubectl -n demo get role hsc-hetzner-server-controller

      - name: Uninstall leaves the CRDs and the user's objects
        run: |
          helm uninstall hsc -n hetzner-server-controller --wait
          kubectl get crd hetznerservers.hcloud.shebanglabs.io

      - name: Controller logs
        if: always()
        run: kubectl -n hetzner-server-controller logs -l app.kubernetes.io/name=hetzner-server-controller --tail=200 || true

  publish-dev:
    name: Publish :dev
    runs-on: ubuntu-latest
    needs: [verify, image, chart]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'shebang-labs'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the registry credentials are configured
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set; nothing was published to $IMAGE."
          fi

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        if: steps.creds.outputs.configured == 'true'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.creds.outputs.configured == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.creds.outputs.configured == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.creds.outputs.configured == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
