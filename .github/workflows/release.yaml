name: Release

# A release is a version tag. Pushing v1.2.3 publishes:
#   - docker.io/shebanglabs/hetzner-server-controller:1.2.3 (+ :latest, + :<sha>), multi-arch, signed
#   - the Helm chart to the GitHub Pages repository and as an OCI artifact on Docker Hub
#   - a GitHub Release with the changelog section and the chart archive
#
# The chart version, the appVersion and package.json must all equal the tag;
# the first job refuses to continue otherwise, before anything is published.

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  # Re-run a release for an existing tag, e.g. after adding the registry
  # secrets: gh workflow run release.yaml --ref v1.2.3
  workflow_dispatch:

env:
  IMAGE: shebanglabs/hetzner-server-controller
  # The chart as an OCI artifact. Not Docker Hub: an OCI chart is stored under
  # its chart name, which is also the image's repository, and the two would
  # fight over the 1.2.3 tag. GHCR allows a charts/ prefix and needs no extra
  # secret.
  CHART_OCI: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART_DIR: charts/hetzner-server-controller

jobs:
  check:
    name: Versions agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          chart=$(awk '/^version:/{print $2}' "$CHART_DIR/Chart.yaml")
          app=$(awk '/^appVersion:/{print $2}' "$CHART_DIR/Chart.yaml" | tr -d '"')
          echo "tag=$tag package.json=$pkg chart=$chart appVersion=$app"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$chart" ] && [ "$tag" = "$app" ] \
            || { echo "::error::tag v$tag does not match package.json ($pkg), Chart.yaml version ($chart) or appVersion ($app)"; exit 1; }
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $tag"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  image:
    name: Publish the image
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
      # Keyless signing with cosign uses the workflow's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to Docker Hub
        # An access token scoped to this repository, not the account password.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # A pre-release must never become :latest.
          flavor: latest=${{ needs.check.outputs.prerelease == 'false' }}
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}
            type=sha,format=long,prefix=
          labels: |
            org.opencontainers.image.title=hetzner-server-controller
            org.opencontainers.image.description=Kubernetes operator for Hetzner Cloud
            org.opencontainers.image.vendor=Shebang Labs
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Sync the Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: Kubernetes operator that manages Hetzner Cloud declaratively
          readme-filepath: docs/docker-hub.md

  chart:
    name: Publish the chart
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      # chart-releaser pushes index.yaml to gh-pages and creates the release;
      # the OCI push needs packages.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Extract the changelog section
        run: |
          awk -v v="${{ needs.check.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            /^## \[/ { if (on) exit }
            on { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          {
            echo
            echo '## Install'
            echo
            echo '```bash'
            echo 'helm repo add shebanglabs https://shebang-labs.github.io/hetzner-server-controller'
            echo "helm install hetzner-server-controller shebanglabs/hetzner-server-controller --version ${{ needs.check.outputs.version }} \\"
            echo '  --namespace hetzner-server-controller --create-namespace --set hetzner.token=<token>'
            echo '```'
            echo
            echo "Image: \`docker.io/${IMAGE}:${{ needs.check.outputs.version }}\` (linux/amd64, linux/arm64, signed with cosign)."
          } >> /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Publish to the GitHub Pages Helm repository
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          pages_branch: gh-pages
          skip_existing: true
          mark_as_latest: ${{ needs.check.outputs.prerelease == 'false' }}
          config: .github/cr.yaml
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_RELEASE_NOTES_FILE: /tmp/release-notes.md

      - name: Keep the Artifact Hub metadata on gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cp .github/artifacthub-repo.yml /tmp/pages/artifacthub-repo.yml
          cd /tmp/pages
          if ! git diff --quiet; then
            git add artifacthub-repo.yml
            git commit -m "Update Artifact Hub metadata"
            git push origin HEAD:gh-pages
          fi

      - name: Publish as an OCI artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "$CHART_DIR" --destination /tmp/chart
          helm push /tmp/chart/hetzner-server-controller-${{ needs.check.outputs.version }}.tgz "$CHART_OCI"
          helm registry logout ghcr.io
