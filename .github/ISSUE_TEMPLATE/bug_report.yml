name: Bug report
description: Something the operator did that it should not have
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste your Hetzner API token, kubeconfig, or any Secret
        contents. If a token appeared somewhere it should not have, report that
        privately instead — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did the operator do, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The manifest you applied, and the steps you took.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Resource status
      description: "Output of `kubectl describe <kind> <name>` — conditions and events are usually the whole story."
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Controller logs
      description: "Relevant lines from `kubectl -n hetzner-server-controller logs deploy/hetzner-server-controller`. They are JSON, one object per line."
      render: shell

  - type: input
    id: version
    attributes:
      label: Controller version
      placeholder: "1.0.0, or the image tag you are running"
    validations:
      required: true

  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version
      placeholder: "output of kubectl version --short"
