{{- if .Values.rbac.create }}
{{- $fullname := include "hcloud-operator.fullname" . }}
{{- $namespaced := ne .Values.controller.watchNamespace "" }}
{{- $plurals := include "hcloud-operator.plurals" . | fromYamlArray }}
# Permissions the controller needs, and no more.
#
# Cluster-scoped by default because the CRDs are namespaced but the controller
# watches every namespace. With controller.watchNamespace set, the same rules
# become a Role in that namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "Role" "ClusterRole" $namespaced }}
metadata:
  name: {{ $fullname }}
  {{- if $namespaced }}
  namespace: {{ .Values.controller.watchNamespace }}
  {{- end }}
  labels:
    {{- include "hcloud-operator.labels" . | nindent 4 }}
rules:
  # The custom resources themselves. No create or delete: those objects belong
  # to the user, the controller manages what they describe.
  - apiGroups: ["hcloud.shebanglabs.io"]
    resources:
      {{- range $plurals }}
      - {{ . }}
      {{- end }}
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["hcloud.shebanglabs.io"]
    resources:
      {{- range $plurals }}
      - {{ . }}/status
      {{- end }}
    verbs: ["get", "update", "patch"]
  # Finalizers, so the controller can release an object once its Hetzner
  # resource is confirmed gone. Without this every delete hangs forever.
  - apiGroups: ["hcloud.shebanglabs.io"]
    resources:
      {{- range $plurals }}
      - {{ . }}/finalizers
      {{- end }}
    verbs: ["update"]
  {{- if .Values.rbac.secretsAccess }}
  # Only to read the PEM material of an uploaded HetznerCertificate, by name.
  # `list` and `watch` are deliberately absent: the controller never enumerates
  # Secrets. Set rbac.secretsAccess=false if you do not use uploaded certificates.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
  # Events, so `kubectl describe` on a resource shows what the controller did.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "RoleBinding" "ClusterRoleBinding" $namespaced }}
metadata:
  name: {{ $fullname }}
  {{- if $namespaced }}
  namespace: {{ .Values.controller.watchNamespace }}
  {{- end }}
  labels:
    {{- include "hcloud-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "Role" "ClusterRole" $namespaced }}
  name: {{ $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hcloud-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
# Leader election. Namespaced on purpose: the lease lives next to the
# controller and nothing outside its own namespace needs to be touched.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hcloud-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hcloud-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "hcloud-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
