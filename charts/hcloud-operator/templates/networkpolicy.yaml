{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hcloud-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hcloud-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hcloud-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Metrics scrapes and, when enabled, admission calls from the API server.
    - ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
        {{- if .Values.webhook.enabled }}
        - port: {{ .Values.webhook.port }}
          protocol: TCP
        {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The Kubernetes API server and the Hetzner Cloud API are both reached over
    # HTTPS. The API server's address is cluster-specific, so this cannot be
    # narrowed further without knowing the cluster; use extraEgress for that.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
