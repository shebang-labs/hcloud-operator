# Kind: HetznerSSHKey  (hcloud.shebanglabs.io/v1alpha1)
#
# This file is the source of truth for the API contract. The TypeScript types
# in src/resources/ mirror it, and test/manifests/ checks that they agree.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hetznersshkeys.hcloud.shebanglabs.io
  labels:
    app.kubernetes.io/name: hcloud-operator
spec:
  group: hcloud.shebanglabs.io
  scope: Namespaced
  names:
    kind: HetznerSSHKey
    listKind: HetznerSSHKeyList
    plural: hetznersshkeys
    singular: hetznersshkey
    shortNames:
      - hkey
    categories:
      - hcloud
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Fingerprint
          type: string
          jsonPath: .status.fingerprint
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: ID
          type: integer
          jsonPath: .status.id
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: An SSH public key registered in the Hetzner Cloud project.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - publicKey
              properties:
                publicKey:
                  type: string
                  description: >-
                    The public key in OpenSSH format, e.g. "ssh-ed25519 AAAA... admin@example.com".
                    Immutable in Hetzner.
                adoptExisting:
                  type: string
                  description: >-
                    Take over a resource that already exists in the Hetzner project instead of
                    creating one. Accepts a Hetzner name or a numeric id.
                deletionPolicy:
                  type: string
                  enum:
                    - Delete
                    - Orphan
                  default: Delete
                  description: >-
                    Delete removes the Hetzner resource with the Kubernetes object. Orphan leaves it
                    running and only drops the finalizer.
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Labels to set on the Hetzner resource, on top of the ownership labels the
                    operator manages.
            status:
              type: object
              properties:
                fingerprint:
                  type: string
                  description: MD5 fingerprint Hetzner computed for the key.
                phase:
                  type: string
                  enum:
                    - Pending
                    - Creating
                    - Ready
                    - Updating
                    - Deleting
                    - Error
                id:
                  type: integer
                  description: Hetzner numeric id. The link between Kubernetes and Hetzner.
                hetznerName:
                  type: string
                  description: Name the resource has inside the Hetzner project.
                message:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - 'True'
                          - 'False'
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
