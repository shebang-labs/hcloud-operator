# Kind: HetznerNetwork  (hcloud.shebanglabs.io/v1alpha1)
#
# This file is the source of truth for the API contract. The TypeScript types
# in src/resources/ mirror it, and test/manifests/ checks that they agree.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hetznernetworks.hcloud.shebanglabs.io
  labels:
    app.kubernetes.io/name: hcloud-operator
spec:
  group: hcloud.shebanglabs.io
  scope: Namespaced
  names:
    kind: HetznerNetwork
    listKind: HetznerNetworkList
    plural: hetznernetworks
    singular: hetznernetwork
    shortNames:
      - hnet
    categories:
      - hcloud
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Range
          type: string
          jsonPath: .status.ipRange
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: ID
          type: integer
          jsonPath: .status.id
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: A Hetzner private network, with its subnets and routes.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - ipRange
              properties:
                ipRange:
                  type: string
                  description: >-
                    The network's CIDR, e.g. "10.0.0.0/16". Can only be widened, and only with
                    allowIpRangeChange.
                subnets:
                  type: array
                  description: >-
                    Subnets carved out of the network's range. Hetzner adds and deletes them one at
                    a time; the operator works out which calls are needed.
                  items:
                    type: object
                    required:
                      - type
                      - ipRange
                      - networkZone
                    properties:
                      type:
                        type: string
                        enum:
                          - cloud
                          - server
                          - vswitch
                      ipRange:
                        type: string
                        description: CIDR inside the network's range, e.g. "10.0.1.0/24".
                      networkZone:
                        type: string
                        description: e.g. "eu-central".
                      vSwitchId:
                        type: integer
                        description: 'Only for type: vswitch.'
                routes:
                  type: array
                  description: >-
                    Static routes inside the network. Traffic for a destination CIDR is sent to the
                    given gateway.
                  items:
                    type: object
                    required:
                      - destination
                      - gateway
                    properties:
                      destination:
                        type: string
                      gateway:
                        type: string
                exposeRoutesToVSwitch:
                  type: boolean
                  description: Publish the network's routes to an attached vSwitch.
                allowIpRangeChange:
                  type: boolean
                  description: >-
                    Required before the operator will widen spec.ipRange, which briefly interrupts
                    private traffic.
                protection:
                  type: object
                  description: Hetzner protection flags.
                  properties:
                    delete:
                      type: boolean
                      description: Refuse deletion until this is turned off.
                adoptExisting:
                  type: string
                  description: >-
                    Take over a resource that already exists in the Hetzner project instead of
                    creating one. Accepts a Hetzner name or a numeric id.
                deletionPolicy:
                  type: string
                  enum:
                    - Delete
                    - Orphan
                  default: Delete
                  description: >-
                    Delete removes the Hetzner resource with the Kubernetes object. Orphan leaves it
                    running and only drops the finalizer.
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Labels to set on the Hetzner resource, on top of the ownership labels the
                    operator manages.
            status:
              type: object
              properties:
                ipRange:
                  type: string
                subnets:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      ipRange:
                        type: string
                      networkZone:
                        type: string
                      gateway:
                        type: string
                routes:
                  type: array
                  items:
                    type: object
                    properties:
                      destination:
                        type: string
                      gateway:
                        type: string
                serverIds:
                  type: array
                  items:
                    type: integer
                loadBalancerIds:
                  type: array
                  items:
                    type: integer
                phase:
                  type: string
                  enum:
                    - Pending
                    - Creating
                    - Ready
                    - Updating
                    - Deleting
                    - Error
                id:
                  type: integer
                  description: Hetzner numeric id. The link between Kubernetes and Hetzner.
                hetznerName:
                  type: string
                  description: Name the resource has inside the Hetzner project.
                message:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - 'True'
                          - 'False'
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
