# Kind: HetznerImage  (hcloud.shebanglabs.io/v1alpha1)
#
# This file is the source of truth for the API contract. The TypeScript types
# in src/resources/ mirror it, and test/manifests/ checks that they agree.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hetznerimages.hcloud.shebanglabs.io
  labels:
    app.kubernetes.io/name: hcloud-operator
spec:
  group: hcloud.shebanglabs.io
  scope: Namespaced
  names:
    kind: HetznerImage
    listKind: HetznerImageList
    plural: hetznerimages
    singular: hetznerimage
    shortNames:
      - himg
    categories:
      - hcloud
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Size
          type: integer
          jsonPath: .status.imageSize
        - name: From
          type: integer
          jsonPath: .status.createdFromServerId
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: ID
          type: integer
          jsonPath: .status.id
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: A snapshot of a Hetzner server's disk.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - sourceServerRef
              properties:
                sourceServerRef:
                  type: object
                  description: >-
                    The server to snapshot. A snapshot is a point in time and cannot be retaken in
                    place. Set exactly one of name, hetznerName or id.
                  properties:
                    name:
                      type: string
                      description: Name of a custom resource of the target kind.
                    namespace:
                      type: string
                      description: Namespace of that custom resource. Defaults to this object's namespace.
                    hetznerName:
                      type: string
                      description: Name of an unmanaged resource that already exists in the Hetzner project.
                    id:
                      type: integer
                      description: Raw Hetzner id.
                  oneOf:
                    - required:
                        - name
                    - required:
                        - hetznerName
                    - required:
                        - id
                description:
                  type: string
                  description: Human description; this is what "hcloud image list" shows.
                protection:
                  type: object
                  description: Hetzner protection flags.
                  properties:
                    delete:
                      type: boolean
                      description: Refuse deletion until this is turned off.
                adoptExisting:
                  type: string
                  description: >-
                    Take over a resource that already exists in the Hetzner project instead of
                    creating one. Accepts a Hetzner name or a numeric id.
                deletionPolicy:
                  type: string
                  enum:
                    - Delete
                    - Orphan
                  default: Delete
                  description: >-
                    Delete removes the Hetzner resource with the Kubernetes object. Orphan leaves it
                    running and only drops the finalizer.
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Labels to set on the Hetzner resource, on top of the ownership labels the
                    operator manages.
            status:
              type: object
              properties:
                description:
                  type: string
                type:
                  type: string
                imageSize:
                  type: integer
                  description: Billed size in GB.
                diskSize:
                  type: integer
                architecture:
                  type: string
                osFlavor:
                  type: string
                createdFromServerId:
                  type: integer
                phase:
                  type: string
                  enum:
                    - Pending
                    - Creating
                    - Ready
                    - Updating
                    - Deleting
                    - Error
                id:
                  type: integer
                  description: Hetzner numeric id. The link between Kubernetes and Hetzner.
                hetznerName:
                  type: string
                  description: Name the resource has inside the Hetzner project.
                message:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - 'True'
                          - 'False'
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
