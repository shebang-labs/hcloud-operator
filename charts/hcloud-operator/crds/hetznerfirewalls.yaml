# Kind: HetznerFirewall  (hcloud.shebanglabs.io/v1alpha1)
#
# This file is the source of truth for the API contract. The TypeScript types
# in src/resources/ mirror it, and test/manifests/ checks that they agree.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hetznerfirewalls.hcloud.shebanglabs.io
  labels:
    app.kubernetes.io/name: hcloud-operator
spec:
  group: hcloud.shebanglabs.io
  scope: Namespaced
  names:
    kind: HetznerFirewall
    listKind: HetznerFirewallList
    plural: hetznerfirewalls
    singular: hetznerfirewall
    shortNames:
      - hfw
    categories:
      - hcloud
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Rules
          type: integer
          jsonPath: .status.ruleCount
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: ID
          type: integer
          jsonPath: .status.id
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: 'A Hetzner firewall: a stateless packet filter and the servers it protects.'
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                rules:
                  type: array
                  description: >-
                    The complete rule set. Hetzner replaces all rules at once, so this is the whole
                    desired state.
                  items:
                    type: object
                    required:
                      - direction
                      - protocol
                    properties:
                      direction:
                        type: string
                        enum:
                          - in
                          - out
                      protocol:
                        type: string
                        enum:
                          - tcp
                          - udp
                          - icmp
                          - esp
                          - gre
                      port:
                        type: string
                        description: A port or range ("80", "8000-8080"). Required for tcp and udp.
                      sourceIps:
                        type: array
                        items:
                          type: string
                        description: 'CIDRs the rule accepts traffic from. Required for direction: in.'
                      destinationIps:
                        type: array
                        items:
                          type: string
                        description: 'CIDRs the rule allows traffic to. Required for direction: out.'
                      description:
                        type: string
                applyToServerRefs:
                  type: array
                  description: Servers this firewall protects.
                  items:
                    type: object
                    description: ' Set exactly one of name, hetznerName or id.'
                    properties:
                      name:
                        type: string
                        description: Name of a custom resource of the target kind.
                      namespace:
                        type: string
                        description: Namespace of that custom resource. Defaults to this object's namespace.
                      hetznerName:
                        type: string
                        description: Name of an unmanaged resource that already exists in the Hetzner project.
                      id:
                        type: integer
                        description: Raw Hetzner id.
                    oneOf:
                      - required:
                          - name
                      - required:
                          - hetznerName
                      - required:
                          - id
                applyToLabelSelectors:
                  type: array
                  items:
                    type: string
                  description: >-
                    Hetzner label selectors this firewall protects, e.g. "role=web". Covers servers
                    created later.
                adoptExisting:
                  type: string
                  description: >-
                    Take over a resource that already exists in the Hetzner project instead of
                    creating one. Accepts a Hetzner name or a numeric id.
                deletionPolicy:
                  type: string
                  enum:
                    - Delete
                    - Orphan
                  default: Delete
                  description: >-
                    Delete removes the Hetzner resource with the Kubernetes object. Orphan leaves it
                    running and only drops the finalizer.
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Labels to set on the Hetzner resource, on top of the ownership labels the
                    operator manages.
            status:
              type: object
              properties:
                ruleCount:
                  type: integer
                appliedToServerIds:
                  type: array
                  items:
                    type: integer
                appliedToLabelSelectors:
                  type: array
                  items:
                    type: string
                phase:
                  type: string
                  enum:
                    - Pending
                    - Creating
                    - Ready
                    - Updating
                    - Deleting
                    - Error
                id:
                  type: integer
                  description: Hetzner numeric id. The link between Kubernetes and Hetzner.
                hetznerName:
                  type: string
                  description: Name the resource has inside the Hetzner project.
                message:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - 'True'
                          - 'False'
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
