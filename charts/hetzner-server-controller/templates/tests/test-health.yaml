# `helm test <release>`: confirms a controller Pod answers on its health port.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "hetzner-server-controller.fullname" . }}-test-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hetzner-server-controller.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: curlimages/curl:8.14.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command:
        - sh
        - -ec
        - |
          url="http://{{ include "hetzner-server-controller.fullname" . }}-metrics.{{ .Release.Namespace }}.svc:{{ .Values.metrics.port }}"
          curl -fsS "$url/healthz"
          curl -fsS "$url/metrics" | grep -q '^hcloud_operator_leader'
