{{- if .Values.webhook.enabled }}
# The API server calls this before writing any Hetzner resource. cert-manager
# fills in caBundle from the Certificate, which is what inject-ca-from is for.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "hetzner-server-controller.fullname" . }}
  labels:
    {{- include "hetzner-server-controller.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "hetzner-server-controller.webhookCertificateName" . }}
webhooks:
  - name: validate.hcloud.shebanglabs.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        name: {{ include "hetzner-server-controller.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 443
    {{- with .Values.controller.watchNamespace }}
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    rules:
      - apiGroups: ["hcloud.shebanglabs.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources:
          {{- include "hetzner-server-controller.plurals" . | nindent 10 }}
        scope: Namespaced
{{- end }}
