# Kind: HetznerLoadBalancer  (hcloud.shebanglabs.io/v1alpha1)
#
# This file is the source of truth for the API contract. The TypeScript types
# in src/resources/ mirror it, and test/manifests/ checks that they agree.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hetznerloadbalancers.hcloud.shebanglabs.io
  labels:
    app.kubernetes.io/name: hetzner-server-controller
spec:
  group: hcloud.shebanglabs.io
  scope: Namespaced
  names:
    kind: HetznerLoadBalancer
    listKind: HetznerLoadBalancerList
    plural: hetznerloadbalancers
    singular: hetznerloadbalancer
    shortNames:
      - hlb
    categories:
      - hcloud
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: IPv4
          type: string
          jsonPath: .status.ipv4
        - name: Type
          type: string
          jsonPath: .status.loadBalancerType
        - name: Healthy
          type: integer
          jsonPath: .status.healthyTargets
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: ID
          type: integer
          jsonPath: .status.id
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: A Hetzner load balancer, with its services, health checks and targets.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - loadBalancerType
              properties:
                loadBalancerType:
                  type: string
                  description: Hetzner load balancer type, e.g. "lb11". Can be changed online.
                location:
                  type: string
                  description: Immutable. Mutually exclusive with networkZone.
                networkZone:
                  type: string
                  description: Immutable. Mutually exclusive with location.
                algorithm:
                  type: string
                  enum:
                    - round_robin
                    - least_connections
                  default: round_robin
                services:
                  type: array
                  description: >-
                    Listeners and where they forward to. Each is keyed by its listen port, which
                    Hetzner requires to be unique.
                  items:
                    type: object
                    required:
                      - protocol
                      - listenPort
                      - destinationPort
                    properties:
                      protocol:
                        type: string
                        enum:
                          - tcp
                          - http
                          - https
                      listenPort:
                        type: integer
                      destinationPort:
                        type: integer
                      proxyProtocol:
                        type: boolean
                        description: Prepend the PROXY protocol header so backends see the real client IP.
                      healthCheck:
                        type: object
                        required:
                          - protocol
                          - port
                        properties:
                          protocol:
                            type: string
                            enum:
                              - tcp
                              - http
                          port:
                            type: integer
                          interval:
                            type: integer
                            default: 15
                            description: Seconds between checks.
                          timeout:
                            type: integer
                            default: 10
                            description: Seconds before a check counts as failed.
                          retries:
                            type: integer
                            default: 3
                            description: Consecutive failures before a target leaves rotation.
                          http:
                            type: object
                            properties:
                              domain:
                                type: string
                              path:
                                type: string
                                default: /
                              response:
                                type: string
                              statusCodes:
                                type: array
                                items:
                                  type: string
                              tls:
                                type: boolean
                      http:
                        type: object
                        properties:
                          certificateRefs:
                            type: array
                            description: 'Certificates to serve. Required for protocol: https.'
                            items:
                              type: object
                              description: ' Set exactly one of name, hetznerName or id.'
                              properties:
                                name:
                                  type: string
                                  description: Name of a custom resource of the target kind.
                                namespace:
                                  type: string
                                  description: >-
                                    Namespace of that custom resource. Defaults to this object's
                                    namespace.
                                hetznerName:
                                  type: string
                                  description: >-
                                    Name of an unmanaged resource that already exists in the Hetzner
                                    project.
                                id:
                                  type: integer
                                  description: Raw Hetzner id.
                              oneOf:
                                - required:
                                    - name
                                - required:
                                    - hetznerName
                                - required:
                                    - id
                          redirectHttp:
                            type: boolean
                          stickySessions:
                            type: boolean
                          cookieName:
                            type: string
                          cookieLifetime:
                            type: integer
                targets:
                  type: array
                  description: >-
                    What the load balancer forwards to. A label selector also covers servers created
                    later.
                  items:
                    type: object
                    description: Set exactly one of serverRef, labelSelector or ip.
                    properties:
                      serverRef:
                        type: object
                        description: >-
                          A server managed by this operator, or an existing one. Set exactly one of
                          name, hetznerName or id.
                        properties:
                          name:
                            type: string
                            description: Name of a custom resource of the target kind.
                          namespace:
                            type: string
                            description: >-
                              Namespace of that custom resource. Defaults to this object's
                              namespace.
                          hetznerName:
                            type: string
                            description: >-
                              Name of an unmanaged resource that already exists in the Hetzner
                              project.
                          id:
                            type: integer
                            description: Raw Hetzner id.
                        oneOf:
                          - required:
                              - name
                          - required:
                              - hetznerName
                          - required:
                              - id
                      labelSelector:
                        type: string
                        description: Every server carrying this Hetzner label selector.
                      ip:
                        type: string
                        description: A plain IP address, for targets outside the Hetzner project.
                      usePrivateIp:
                        type: boolean
                        description: Route to the target over the private network instead of the public one.
                    oneOf:
                      - required:
                          - serverRef
                      - required:
                          - labelSelector
                      - required:
                          - ip
                networkRef:
                  type: object
                  description: >-
                    Attach the load balancer to a private network. Set exactly one of name,
                    hetznerName or id.
                  properties:
                    name:
                      type: string
                      description: Name of a custom resource of the target kind.
                    namespace:
                      type: string
                      description: Namespace of that custom resource. Defaults to this object's namespace.
                    hetznerName:
                      type: string
                      description: Name of an unmanaged resource that already exists in the Hetzner project.
                    id:
                      type: integer
                      description: Raw Hetzner id.
                  oneOf:
                    - required:
                        - name
                    - required:
                        - hetznerName
                    - required:
                        - id
                publicInterface:
                  type: boolean
                  default: true
                  description: Give it a public IP. Disable for an internal-only load balancer.
                protection:
                  type: object
                  description: Hetzner protection flags.
                  properties:
                    delete:
                      type: boolean
                      description: Refuse deletion until this is turned off.
                adoptExisting:
                  type: string
                  description: >-
                    Take over a resource that already exists in the Hetzner project instead of
                    creating one. Accepts a Hetzner name or a numeric id.
                deletionPolicy:
                  type: string
                  enum:
                    - Delete
                    - Orphan
                  default: Delete
                  description: >-
                    Delete removes the Hetzner resource with the Kubernetes object. Orphan leaves it
                    running and only drops the finalizer.
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Labels to set on the Hetzner resource, on top of the ownership labels the
                    operator manages.
            status:
              type: object
              properties:
                ipv4:
                  type: string
                ipv6:
                  type: string
                loadBalancerType:
                  type: string
                algorithm:
                  type: string
                location:
                  type: string
                serviceCount:
                  type: integer
                targetCount:
                  type: integer
                healthyTargets:
                  type: integer
                privateIps:
                  type: array
                  items:
                    type: string
                phase:
                  type: string
                  enum:
                    - Pending
                    - Creating
                    - Ready
                    - Updating
                    - Deleting
                    - Error
                id:
                  type: integer
                  description: Hetzner numeric id. The link between Kubernetes and Hetzner.
                hetznerName:
                  type: string
                  description: Name the resource has inside the Hetzner project.
                message:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - 'True'
                          - 'False'
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
