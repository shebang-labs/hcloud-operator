# Kind: HetznerFloatingIP  (hcloud.shebanglabs.io/v1alpha1)
#
# This file is the source of truth for the API contract. The TypeScript types
# in src/resources/ mirror it, and test/manifests/ checks that they agree.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hetznerfloatingips.hcloud.shebanglabs.io
  labels:
    app.kubernetes.io/name: hetzner-server-controller
spec:
  group: hcloud.shebanglabs.io
  scope: Namespaced
  names:
    kind: HetznerFloatingIP
    listKind: HetznerFloatingIPList
    plural: hetznerfloatingips
    singular: hetznerfloatingip
    shortNames:
      - hfip
    categories:
      - hcloud
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: IP
          type: string
          jsonPath: .status.ip
        - name: Assigned
          type: boolean
          jsonPath: .status.assigned
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: ID
          type: integer
          jsonPath: .status.id
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: A Hetzner floating IP, which can be moved between servers for failover.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum:
                    - ipv4
                    - ipv6
                  description: Immutable.
                homeLocation:
                  type: string
                  description: Where the IP is homed when unassigned, e.g. "nbg1". Immutable.
                description:
                  type: string
                  description: Free-text note shown next to the address in the Hetzner console.
                serverRef:
                  type: object
                  description: >-
                    The server the IP points at. Omit to leave it unassigned. Set exactly one of
                    name, hetznerName or id.
                  properties:
                    name:
                      type: string
                      description: Name of a custom resource of the target kind.
                    namespace:
                      type: string
                      description: Namespace of that custom resource. Defaults to this object's namespace.
                    hetznerName:
                      type: string
                      description: Name of an unmanaged resource that already exists in the Hetzner project.
                    id:
                      type: integer
                      description: Raw Hetzner id.
                  oneOf:
                    - required:
                        - name
                    - required:
                        - hetznerName
                    - required:
                        - id
                dnsPtr:
                  type: array
                  description: Reverse DNS entries to publish for this resource's addresses.
                  items:
                    type: object
                    required:
                      - ip
                      - dnsPtr
                    properties:
                      ip:
                        type: string
                      dnsPtr:
                        type: string
                        description: Hostname to publish, or null to clear the entry.
                        nullable: true
                protection:
                  type: object
                  description: Hetzner protection flags.
                  properties:
                    delete:
                      type: boolean
                      description: Refuse deletion until this is turned off.
                adoptExisting:
                  type: string
                  description: >-
                    Take over a resource that already exists in the Hetzner project instead of
                    creating one. Accepts a Hetzner name or a numeric id.
                deletionPolicy:
                  type: string
                  enum:
                    - Delete
                    - Orphan
                  default: Delete
                  description: >-
                    Delete removes the Hetzner resource with the Kubernetes object. Orphan leaves it
                    running and only drops the finalizer.
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Labels to set on the Hetzner resource, on top of the ownership labels the
                    operator manages.
            status:
              type: object
              properties:
                ip:
                  type: string
                type:
                  type: string
                homeLocation:
                  type: string
                assignedToServerId:
                  type: integer
                assigned:
                  type: boolean
                blocked:
                  type: boolean
                phase:
                  type: string
                  enum:
                    - Pending
                    - Creating
                    - Ready
                    - Updating
                    - Deleting
                    - Error
                id:
                  type: integer
                  description: Hetzner numeric id. The link between Kubernetes and Hetzner.
                hetznerName:
                  type: string
                  description: Name the resource has inside the Hetzner project.
                message:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - 'True'
                          - 'False'
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
